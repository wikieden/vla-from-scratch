<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">FAST：一段动作 → 归一化 → DCT → 缩放取整 → BPE</text>
<text x="16.0" y="200.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">fast-tokenizer L222–L245、图 4。低频在前、高频几乎全是 0，BPE 把一长串 0 合成一个 token。</text>
<rect x="20.0" y="70.0" width="160.0" height="90.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4" opacity="1"/>
<text x="100.0" y="104.2" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">① 归一化</text>
<text x="100.0" y="121.8" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal">1%–99% 分位数</text>
<text x="100.0" y="136.6" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal">缩放到 [−1, 1]</text>
<rect x="198.0" y="70.0" width="160.0" height="90.0" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4" opacity="1"/>
<text x="278.0" y="104.2" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">② DCT</text>
<text x="278.0" y="121.8" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal">每维 50 个时刻</text>
<text x="278.0" y="136.6" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal">→ 50 个频率</text>
<rect x="376.0" y="70.0" width="160.0" height="90.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4" opacity="1"/>
<text x="456.0" y="104.2" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">③ 乘 γ 取整</text>
<text x="456.0" y="121.8" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal">小系数变 0</text>
<text x="456.0" y="136.6" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal">矩阵很稀疏</text>
<rect x="554.0" y="70.0" width="160.0" height="90.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4" opacity="1"/>
<text x="634.0" y="104.2" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">④ BPE</text>
<text x="634.0" y="121.8" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal">常见组合</text>
<text x="634.0" y="136.6" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal">合成一个 token</text>
<rect x="732.0" y="70.0" width="160.0" height="90.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" opacity="1"/>
<text x="812.0" y="104.2" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">少量 token</text>
<text x="812.0" y="121.8" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal">信息量高</text>
<text x="812.0" y="136.6" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal">相邻不再相像</text>
<line x1="180.0" y1="115.0" x2="198.0" y2="115.0" stroke="#4b5563" stroke-width="1.6"/>
<polygon points="198.0,115.0 190.1,119.2 190.1,110.8" fill="#4b5563" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<line x1="358.0" y1="115.0" x2="376.0" y2="115.0" stroke="#4b5563" stroke-width="1.6"/>
<polygon points="376.0,115.0 368.1,119.2 368.1,110.8" fill="#4b5563" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<line x1="536.0" y1="115.0" x2="554.0" y2="115.0" stroke="#4b5563" stroke-width="1.6"/>
<polygon points="554.0,115.0 546.1,119.2 546.1,110.8" fill="#4b5563" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<line x1="714.0" y1="115.0" x2="732.0" y2="115.0" stroke="#4b5563" stroke-width="1.6"/>
<polygon points="732.0,115.0 724.1,119.2 724.1,110.8" fill="#4b5563" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
</svg>
