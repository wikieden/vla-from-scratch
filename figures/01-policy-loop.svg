<text x="16.0" y="250.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">a_t = π(o_t, ℓ)。RT-1 一秒 3 次，π0 最高 50 次。</text>
