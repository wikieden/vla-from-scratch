<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>回合数和区间宽度</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.num{font-size:16px;font-weight:600}</style></head>
<body><main>
<h1>第 19 章 · 回合越多，区间越窄</h1>
<p class="sub">配套讲义：<a href="../lessons/19-evaluation.html">第 19 章 · 评测：97.1% 和 96.4%，到底谁更强</a>。95% Wilson 区间；两比例 z 检验用合并成功率。成功次数按 round(成功率 × n) 取整。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 360"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row"><label for="a">模型 A 成功率 %</label><input type="range" id="a" min="50" max="100" step="0.1" value="70"><span id="av">70</span><label for="b">模型 B 成功率 %</label><input type="range" id="b" min="50" max="100" step="0.1" value="60"><span id="bv">60</span><label for="n">每个模型回合数 n</label><input type="range" id="n" min="10" max="2000" step="10" value="10"><span id="nv">10</span></div>
<p class="note">看点：① 两根横条是 A、B 的 Wilson 区间，点是估计值；② 右边是 z 和 p，p < 0.05 标绿；③ 播放：70 vs 60、n = 10 → 80 → 500；97.1 vs 96.4、n = 500 → 2000。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');
function R(x,y,w,h,col,op){return el('rect',{x,y,width:Math.max(w,1),height:h,rx:4,fill:col,opacity:op??.7},sv)}
function T(s,x,y,a,c){return txt(s,{x,y,'text-anchor':a||'start',class:c||'m'},sv)}
function cap(s){T(s,340,26,'middle','cap')}
const GET=ids=>ids.map(i=>{const e=$(i);return e.type==='checkbox'?+e.checked:+e.value});
function SET(ids,v){ids.forEach((i,k)=>{const e=$(i);if(e.type==='checkbox')e.checked=!!v[k];else e.value=v[k];const o=$(i+'v');if(o)o.textContent=(+v[k]).toString()})}
const IDS=['a','b','n'],F=[[70,60,10],[70,60,80],[70,60,500],[97.1,96.4,500],[97.1,96.4,2000]];
const W=(k,n)=>{const z=1.96,p=k/n,d=1+z*z/n,c=(p+z*z/(2*n))/d,h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d;return[c-h,c+h]};
function erfc(x){const t=1/(1+0.5*x),y=t*Math.exp(-x*x-1.26551223+t*(1.00002368+t*(0.37409196+t*(0.09678418+t*(-0.18628806+t*(0.27886807+t*(-1.13520398+t*(1.48851587+t*(-0.82215223+t*0.17087277)))))))));return y}
function render(a,b,n){const ka=Math.round(a/100*n),kb=Math.round(b/100*n),pp=(ka+kb)/(2*n),z=(ka/n-kb/n)/Math.sqrt(pp*(1-pp)*2/n),p=erfc(Math.abs(z)/Math.SQRT2);
 cap(`n = ${n}：z = ${z.toFixed(2)}，p = ${p.toFixed(3)} ${p<0.05?'（显著）':'（分不出高下）'}`);const X=v=>60+(v-0.3)/0.7*560;
 [[ka,'A','var(--accent)',110],[kb,'B','var(--warm)',190]].forEach(([k,nm,c,y])=>{const [lo,hi]=W(k,n);el('line',{x1:X(lo),y1:y,x2:X(hi),y2:y,stroke:c,'stroke-width':6},sv);el('circle',{cx:X(k/n),cy:y,r:6,fill:c},sv);T(`${nm}：${(100*k/n).toFixed(1)}%  [${(100*lo).toFixed(1)}, ${(100*hi).toFixed(1)}]`,60,y-14,'start')});
 [0.3,0.5,0.7,0.9,1].forEach(v=>T(`${v*100}%`,X(v),260,'middle'));el('line',{x1:60,y1:245,x2:620,y2:245,stroke:'var(--line)'},sv);
 T(`p = ${p.toFixed(3)}`,60,310,'start','num');if(p<0.05)R(56,292,140,26,'var(--good)',.2)}
let k=0,custom=null;
function draw(){clear(sv);const v=custom||F[k];SET(IDS,v);render(...v)}
function reset(){k=0;custom=null;draw()}
function next(){if(custom!==null){custom=null;draw();return true}if(k>=F.length-1)return false;k++;draw();return true}
IDS.forEach(i=>{const e=$(i);const f=()=>{ANIM.stop();custom=GET(IDS);draw()};e.oninput=f;e.onchange=f});
setupPlayer({captureSeed:1,reset,next},1500);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
