<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>显存够不够</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.num{font-size:16px;font-weight:600}</style></head>
<body><main>
<h1>第 21 章 · 模型规模、微调方式与显存</h1>
<p class="sub">配套讲义：<a href="../lessons/21-open-models-2026.html">第 21 章 · 2026 开源 VLA：读一份 config，选一个能微调的模型</a>。只算权重和优化器：全参数 16 字节/参数（bf16 权重 2 + 梯度 2 + fp32 主权重 4 + Adam 8）；LoRA ≈ 2；只推理 2。激活另算。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 360"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row"><label for="p">参数量（B）</label><input type="range" id="p" min="0.1" max="8" step="0.05" value="0.45"><span id="pv">0.45</span><label for="md">方式</label><select id="md"><option value="16">全参数</option><option value="2">LoRA</option><option value="2.001">只推理</option></select><label for="v">显卡显存 GB</label><input type="range" id="v" min="8" max="80" step="8" value="24"><span id="vv">24</span></div>
<p class="note">看点：① 竖条是需要的显存，分成权重、梯度、优化器状态几段；② 虚线是显卡显存，超过标红；③ 播放：0.45B 全参数 / 24 GB → 4B 全参数 / 24 GB → 4B LoRA → 4B 全参数 / 80 GB → 4B 只推理。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');
function R(x,y,w,h,col,op){return el('rect',{x,y,width:Math.max(w,1),height:h,rx:4,fill:col,opacity:op??.7},sv)}
function T(s,x,y,a,c){return txt(s,{x,y,'text-anchor':a||'start',class:c||'m'},sv)}
function cap(s){T(s,340,26,'middle','cap')}
const GET=ids=>ids.map(i=>{const e=$(i);return e.type==='checkbox'?+e.checked:+e.value});
function SET(ids,v){ids.forEach((i,k)=>{const e=$(i);if(e.type==='checkbox')e.checked=!!v[k];else e.value=v[k];const o=$(i+'v');if(o)o.textContent=(+v[k]).toString()})}
const IDS=['p','md','v'],F=[[0.45,16,24],[4,16,24],[4,2,24],[4,16,80],[4,2.001,24]];
function render(p,md,v){const full=md==16,parts=full?[['权重 bf16',2,'var(--accent)'],['梯度',2,'var(--teal)'],['fp32 主权重',4,'var(--purple)'],['Adam 两个状态',8,'var(--warm)']]:[['权重 bf16',2,'var(--accent)']];
 const tot=p*parts.reduce((a,b)=>a+b[1],0),ok=tot<=v,Y=g=>300-Math.min(g,130)/130*240;
 cap(`${(+p).toFixed(2)}B、${full?'全参数':(md==2?'LoRA':'只推理')}：${tot.toFixed(1)} GB ${ok?'≤':'>'} ${v} GB ${ok?'放得下':'放不下'}`);let acc=0;
 parts.forEach(([n,b,c])=>{const g=p*b;R(200,Y(acc+g),120,Y(acc)-Y(acc+g),c);if(Y(acc)-Y(acc+g)>14)T(`${n} ${g.toFixed(1)}`,330,(Y(acc)+Y(acc+g))/2+4,'start');acc+=g});
 el('line',{x1:160,y1:Y(v),x2:520,y2:Y(v),stroke:ok?'var(--good)':'var(--bad)','stroke-dasharray':'5 4','stroke-width':2},sv);T(`显卡 ${v} GB`,525,Y(v)+4,'start')}
let k=0,custom=null;
function draw(){clear(sv);const v=custom||F[k];SET(IDS,v);render(...v)}
function reset(){k=0;custom=null;draw()}
function next(){if(custom!==null){custom=null;draw();return true}if(k>=F.length-1)return false;k++;draw();return true}
IDS.forEach(i=>{const e=$(i);const f=()=>{ANIM.stop();custom=GET(IDS);draw()};e.oninput=f;e.onchange=f});
setupPlayer({captureSeed:1,reset,next},1500);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
