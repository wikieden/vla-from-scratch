<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素损失与潜空间损失</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.num{font-size:16px;font-weight:600}</style></head>
<body><main>
<h1>第 20 章 · 像素损失 vs 潜空间损失</h1>
<p class="sub">配套讲义：<a href="../lessons/20-latent-world-model.html">第 20 章 · 潜空间世界模型：VLA-JEPA，看视频学&quot;世界怎么变&quot;，但别偷看答案</a>。玩具设定（编的）：一帧 = 1 个物体位置 + n 个背景像素；物体移动 m；背景每个像素随相机抖动（标准差 σ）。理想编码器只留物体。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 360"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row"><label for="s">背景抖动 σ</label><input type="range" id="s" min="0" max="1" step="0.05" value="0"><span id="sv">0</span><label for="b">背景像素数</label><input type="range" id="b" min="10" max="400" step="10" value="100"><span id="bv">100</span><label for="m">物体移动</label><input type="range" id="m" min="0" max="2" step="0.1" value="1"><span id="mv">1</span><label><input type="checkbox" id="lk"> 编码器看得到未来帧（泄露）</label></div>
<p class="note">看点：① 两根横条是像素损失和潜空间损失，橙 = 物体、灰 = 背景；② 背景占比写在右边；③ 打开泄露：隐动作直接抄未来，重建误差 0，但和物体移动多少无关；④ 播放：没有抖动 → σ = 0.5 → 背景 400 → 打开泄露。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');
function R(x,y,w,h,col,op){return el('rect',{x,y,width:Math.max(w,1),height:h,rx:4,fill:col,opacity:op??.7},sv)}
function T(s,x,y,a,c){return txt(s,{x,y,'text-anchor':a||'start',class:c||'m'},sv)}
function cap(s){T(s,340,26,'middle','cap')}
const GET=ids=>ids.map(i=>{const e=$(i);return e.type==='checkbox'?+e.checked:+e.value});
function SET(ids,v){ids.forEach((i,k)=>{const e=$(i);if(e.type==='checkbox')e.checked=!!v[k];else e.value=v[k];const o=$(i+'v');if(o)o.textContent=(+v[k]).toString()})}
const IDS=['s','b','m','lk'],F=[[0,100,1,0],[0.5,100,1,0],[0.5,400,1,0],[0.5,400,1,1]];
function render(s,b,m,lk){const obj=m*m,bg=b*s*s,tot=obj+bg,sc=v=>Math.min(v,110)/110*480;
 cap(lk?'泄露：重建误差 0，隐动作只是把下一帧抄了下来':`像素损失 ${tot.toFixed(1)}，背景占 ${tot?(100*bg/tot).toFixed(0):0}%；潜空间 ${obj.toFixed(1)}`);
 seed(3);for(let i=0;i<Math.min(b,120);i++){const x=60+(i%20)*12,y=60+Math.floor(i/20)*12;R(x,y+gauss()*s*3,8,8,'var(--muted)',.35)}
 R(330,90+0,18,18,'var(--teal)',.9);R(330+m*30,90,18,18,'var(--teal)',.4);T('物体：这一帧 → 下一帧',330,80,'start');
 const L=lk?[0,0]:[obj,bg];T('像素',60,210,'start');R(110,195,sc(L[0]),24,'var(--warm)');R(110+sc(L[0]),195,sc(L[1]),24,'var(--muted)',.6);
 T('潜空间',60,260,'start');R(110,245,sc(lk?0:obj),24,'var(--warm)');T(lk?'0（和动作无关）':`${obj.toFixed(1)}`,120+sc(lk?0:obj),262,'start','num')}
let k=0,custom=null;
function draw(){clear(sv);const v=custom||F[k];SET(IDS,v);render(...v)}
function reset(){k=0;custom=null;draw()}
function next(){if(custom!==null){custom=null;draw();return true}if(k>=F.length-1)return false;k++;draw();return true}
IDS.forEach(i=>{const e=$(i);const f=()=>{ANIM.stop();custom=GET(IDS);draw()};e.oninput=f;e.onchange=f});
setupPlayer({captureSeed:1,reset,next},1500);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
